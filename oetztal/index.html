<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Check-in · MYALPS Ötztal</title>

<!-- ============================================================= -->
<!--  MYALPS · CHECK-IN LANDINGPAGE                                -->
<!--                                                                -->
<!--  SO PASST DU DIE SEITE PRO HAUS AN:                           -->
<!--  1. Adresse, WLAN-Name (und bei Bedarf Parken / Check-in)    -->
<!--     stehen ZENTRAL in der Datei  haeuser.js  im Hauptordner. -->
<!--     Nur dort eintragen - diese Datei nicht anfassen.         -->
<!--  2. Die zwei Sprachen (DE/EN) stehen im <script> unten       -->
<!--     im Objekt "content". Text dort anpassen, fertig.          -->
<!--                                                                -->
<!--  SICHERHEIT – BITTE LESEN:                                    -->
<!--  Diese Seite ist über den QR-Code oeffentlich erreichbar.     -->
<!--  Es dürfen hier NIEMALS Türcodes, Schlüsselverstecke oder     -->
<!--  WLAN-Passwörter stehen. Diese Daten gehören ausschliesslich  -->
<!--  in die persönliche E-Mail an den Gast.                       -->
<!-- ============================================================= -->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root{
    --spruce:#123a31;
    --spruce-deep:#0d2b25;
    --snow:#f6f4ed;
    --card:#ffffff;
    --ink:#182320;
    --muted:#5e6c65;
    --amber:#e6a13c;
    --amber-deep:#b9762a;
    --line:#e5e0d3;
    --line-dark:rgba(255,255,255,.14);
    --display:"Bricolage Grotesque",sans-serif;
    --body:"Hanken Grotesk",-apple-system,BlinkMacSystemFont,sans-serif;
  }

  *{box-sizing:border-box;margin:0;padding:0}

  html{-webkit-text-size-adjust:100%}

  body{
    font-family:var(--body);
    background:var(--snow);
    color:var(--ink);
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }

  .wrap{max-width:560px;margin:0 auto;background:var(--snow)}

  /* ---------- Sprachumschalter ---------- */
  .langbar{
    display:flex;justify-content:flex-end;gap:6px;
    padding:14px 20px 0;
  }
  .langbar button{
    font-family:var(--body);font-size:13px;font-weight:600;
    letter-spacing:.04em;
    color:#cdd8d3;background:transparent;
    border:1px solid var(--line-dark);
    border-radius:999px;padding:5px 12px;cursor:pointer;
    transition:background .15s,color .15s,border-color .15s;
  }
  .langbar button:hover{background:rgba(255,255,255,.08)}
  .langbar button[aria-pressed="true"]{
    background:var(--amber);color:var(--spruce-deep);
    border-color:var(--amber);
  }
  .langbar button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

  /* ---------- Hero ---------- */
  .hero{
    background:var(--spruce);
    color:#eef3f0;
    padding:0 24px 0;
    position:relative;
  }
  .hero-inner{padding:34px 0 60px}

  .eyebrow{
    font-size:12px;font-weight:600;letter-spacing:.22em;
    text-transform:uppercase;color:var(--amber);
    margin-bottom:18px;
  }
  .brand{
    font-family:var(--display);font-weight:700;
    font-size:15px;letter-spacing:.02em;color:#dfe8e4;
  }
  h1{
    font-family:var(--display);
    font-weight:600;
    font-size:clamp(30px,8.5vw,42px);
    line-height:1.08;
    letter-spacing:-.01em;
    margin:16px 0 14px;
  }
  .hero p{
    font-size:17px;color:#c3d1cb;max-width:30ch;
  }

  /* Bergsilhouette als Trennlinie zum Inhalt */
  .ridge{display:block;width:100%;height:44px;color:var(--snow)}

  /* ---------- Inhalt ---------- */
  .content{padding:8px 20px 40px}

  /* Haupt-Hinweiskarte: "Prüfen Sie Ihre E-Mail" */
  .mail-card{
    background:var(--card);
    border:1px solid var(--line);
    border-left:4px solid var(--amber);
    border-radius:14px;
    padding:24px 22px;
    margin-top:-24px;
    position:relative;
    box-shadow:0 12px 30px -18px rgba(18,58,49,.4);
  }
  .mail-icon{
    width:44px;height:44px;border-radius:11px;
    background:#fbf0dc;color:var(--amber-deep);
    display:flex;align-items:center;justify-content:center;
    margin-bottom:16px;
  }
  .mail-icon svg{width:24px;height:24px}
  .mail-card h2{
    font-family:var(--display);font-weight:600;
    font-size:21px;line-height:1.2;margin-bottom:10px;
  }
  .mail-card p{color:var(--muted);font-size:15.5px}
  .mail-hint{
    margin-top:16px;padding-top:15px;
    border-top:1px solid var(--line);
    font-size:13.5px;color:var(--muted);
  }
  .mail-hint strong{color:var(--ink);font-weight:600}

  /* Infoblock */
  .info-title{
    font-family:var(--display);font-weight:600;
    font-size:14px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--muted);
    margin:38px 0 6px;
  }
  .info-list{list-style:none}
  .info-list li{
    display:flex;gap:15px;align-items:flex-start;
    padding:16px 2px;
    border-bottom:1px solid var(--line);
  }
  .info-list li:last-child{border-bottom:none}
  .info-ic{
    flex:0 0 22px;color:var(--spruce);margin-top:2px;
  }
  .info-ic svg{width:22px;height:22px;display:block}
  .info-label{
    font-size:12px;font-weight:600;letter-spacing:.08em;
    text-transform:uppercase;color:var(--muted);
    margin-bottom:1px;
  }
  .info-val{font-size:16px;color:var(--ink);font-weight:500}
  .info-val a{color:var(--spruce);text-decoration:none;border-bottom:1px solid var(--amber)}
  .info-val a:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

  /* Kontakt CTA */
  .call{
    display:flex;align-items:center;justify-content:center;gap:10px;
    margin-top:26px;
    background:var(--spruce);color:#fff;
    text-decoration:none;
    font-weight:600;font-size:16.5px;
    padding:16px;border-radius:12px;
    transition:background .15s;
  }
  .call:hover{background:var(--spruce-deep)}
  .call:focus-visible{outline:2px solid var(--amber);outline-offset:3px}
  .call svg{width:20px;height:20px}

  footer{
    text-align:center;padding:30px 20px 40px;
    color:var(--muted);font-size:12.5px;
  }
  footer .fbrand{font-family:var(--display);font-weight:600;color:var(--ink)}

  @media (prefers-reduced-motion:reduce){
    *{transition:none!important;animation:none!important}
  }
</style>
</head>

<body>
<div class="wrap">

  <div class="hero">
    <div class="langbar" role="group" aria-label="Sprache / Language">
      <button data-lang="de" aria-pressed="true">DE</button>
      <button data-lang="en" aria-pressed="false">EN</button>
    </div>

    <div class="hero-inner">
      <!-- Hausname (steht fest, gehoert zu dieser Seite) -->
      <div class="brand">MYALPS Ötztal</div>
      <div class="eyebrow" data-i18n="eyebrow"></div>
      <h1 data-i18n="heroTitle"></h1>
      <p data-i18n="heroSub"></p>
    </div>
  </div>

  <svg class="ridge" viewBox="0 0 560 44" preserveAspectRatio="none" aria-hidden="true">
    <path fill="currentColor" d="M0 44 L0 30 L70 12 L130 26 L210 4 L300 24 L370 10 L450 28 L520 14 L560 26 L560 44 Z"/>
  </svg>

  <div class="content">

    <!-- Hauptbotschaft: E-Mail prüfen -->
    <div class="mail-card">
      <div class="mail-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2.5" y="4.5" width="19" height="15" rx="2.5"/>
          <path d="M3 6l9 7 9-7"/>
        </svg>
      </div>
      <h2 data-i18n="mailTitle"></h2>
      <p data-i18n="mailBody"></p>
      <div class="mail-hint" data-i18n="mailHint"></div>
    </div>

    <!-- Unkritische Infos -->
    <h3 class="info-title" data-i18n="infoTitle"></h3>
    <ul class="info-list">

      <li>
        <span class="info-ic" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-5.7 7-11a7 7 0 1 0-14 0c0 5.3 7 11 7 11Z"/><circle cx="12" cy="10" r="2.5"/></svg>
        </span>
        <div>
          <div class="info-label" data-i18n="lblAddress"></div>
          <!-- Wert steht in haeuser.js -->
          <div class="info-val" id="hausAdresse"></div>
        </div>
      </li>

      <li>
        <span class="info-ic" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="17" height="17" rx="3"/><path d="M9 16.5V7.5h3.5a2.75 2.75 0 0 1 0 5.5H9"/></svg>
        </span>
        <div>
          <div class="info-label" data-i18n="lblParking"></div>
          <!-- Standardtext unten; Abweichung in haeuser.js -->
          <div class="info-val" data-i18n="valParking"></div>
        </div>
      </li>

      <li>
        <span class="info-ic" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>
        </span>
        <div>
          <div class="info-label" data-i18n="lblCheckin"></div>
          <!-- Standardtext unten; Abweichung in haeuser.js -->
          <div class="info-val" data-i18n="valCheckin"></div>
        </div>
      </li>

      <li>
        <span class="info-ic" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9c4.5-3.5 11.5-3.5 16 0"/><path d="M7 12.5c3-2.3 7-2.3 10 0"/><path d="M10 16c1.2-.9 2.8-.9 4 0"/><circle cx="12" cy="19" r=".6" fill="currentColor"/></svg>
        </span>
        <div>
          <div class="info-label" data-i18n="lblWifi"></div>
          <!-- Wert steht in haeuser.js (nur NAME, nie das Passwort) -->
          <div class="info-val" id="hausWlan"></div>
        </div>
      </li>

      <li>
        <span class="info-ic" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="10.5" width="15" height="9" rx="2"/><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5"/><circle cx="12" cy="15" r="1.1" fill="currentColor"/></svg>
        </span>
        <div>
          <div class="info-label" data-i18n="lblWifiPw"></div>
          <!-- Wert steht in haeuser.js (optional - leer lassen = wird nicht angezeigt) -->
          <div class="info-val" id="hausWlanPw"></div>
        </div>
      </li>

      <li>
        <span class="info-ic" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v5"/><circle cx="12" cy="8" r=".8" fill="currentColor"/></svg>
        </span>
        <div>
          <div class="info-label" data-i18n="lblHinweis"></div>
          <!-- Wert steht in haeuser.js (optional - leer lassen = wird nicht angezeigt) -->
          <div class="info-val" id="hausHinweis"></div>
        </div>
      </li>
    </ul>

    <!-- Offizielle MYALPS-Nummer -->
    <a class="call" id="callLink" href="tel:+43720502525">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 5.5c0 8 6 14 14 14 .9 0 1.6-.4 2-1.1l.8-1.4a1.3 1.3 0 0 0-.5-1.7l-2.8-1.5a1.3 1.3 0 0 0-1.6.3l-.9 1c-1.9-1-3.4-2.5-4.4-4.4l1-.9a1.3 1.3 0 0 0 .3-1.6L10.7 5.2a1.3 1.3 0 0 0-1.7-.5L7.6 5.5c-.7.4-1.1 1.1-1.1 2Z"/></svg>
      <span data-i18n="callLabel"></span>
    </a>

    <footer>
      <span class="fbrand">MYALPS</span> · <span data-i18n="footer"></span>
    </footer>

  </div>
</div>

<script src="../haeuser.js"></script>
<script>
/* =============================================================
   SPRACHEN – hier den Text anpassen. Struktur nicht verändern.
   ============================================================= */
const content = {
  de:{
    eyebrow:"Willkommen bei MYALPS",
    heroTitle:"Schön, dass du da bist.",
    heroSub:"Alles für deinen Check-in wartet in deiner letzten E-Mail von uns.",
    mailTitle:"Deine Check-in-Daten stehen in deiner E-Mail",
    mailBody:"Vor deiner Anreise haben wir dir eine E-Mail mit deinem persönlichen Zugang und allen Schritten geschickt. Öffne bitte die letzte E-Mail von MYALPS – dort findest du alles, was du für den Check-in brauchst.",
    mailHint:"Absender: <strong>MYALPS</strong> · Betreff: „Dein Abenteuer im ÖTZTAL“. Schau bitte auch im Spam-Ordner nach.",
    infoTitle:"Gut zu wissen",
    lblAddress:"Adresse",
    lblParking:"Parken",
    valParking:"Kostenfreier Stellplatz direkt am Haus",
    lblCheckin:"Check-in ab",
    valCheckin:"16:00 Uhr",
    lblWifi:"WLAN-Netz",
    lblWifiPw:"WLAN-Passwort",
    lblHinweis:"Hinweis",
    callLabel:"MYALPS anrufen",
    footer:"Wir wünschen dir einen schönen Aufenthalt."
  },
  en:{
    eyebrow:"Welcome to MYALPS",
    heroTitle:"We're glad you're here.",
    heroSub:"Everything for your check-in is waiting in your latest email from us.",
    mailTitle:"Your check-in details are in your email",
    mailBody:"Before your arrival we sent you an email with your personal access and every step. Please open the latest email from MYALPS — it contains everything you need to check in.",
    mailHint:"Sender: <strong>MYALPS</strong> · Subject: “Your adventure in ÖTZTAL”. Please also check your spam folder.",
    infoTitle:"Good to know",
    lblAddress:"Address",
    lblParking:"Parking",
    valParking:"Free parking space right at the house",
    lblCheckin:"Check-in from",
    valCheckin:"4:00 PM",
    lblWifi:"Wi-Fi network",
    lblWifiPw:"Wi-Fi password",
    lblHinweis:"Please note",
    callLabel:"Call MYALPS",
    footer:"We wish you a wonderful stay."
  }
};

function setLang(lang){
  const dict=content[lang];
  document.documentElement.lang=lang;
  document.querySelectorAll("[data-i18n]").forEach(el=>{
    const key=el.getAttribute("data-i18n");
    if(dict[key]!==undefined) el.innerHTML=dict[key];
  });
  document.querySelectorAll(".langbar button").forEach(b=>{
    b.setAttribute("aria-pressed", b.dataset.lang===lang ? "true" : "false");
  });
}

document.querySelectorAll(".langbar button").forEach(b=>{
  b.addEventListener("click",()=>setLang(b.dataset.lang));
});

/* Startsprache: Browsersprache, sonst Deutsch */
const nav=(navigator.language||"de").slice(0,2).toLowerCase();
setLang(content[nav] ? nav : "de");

/* =============================================================
   HAUSDATEN aus der Datei haeuser.js einsetzen
   (Adresse, WLAN-Name, ggf. Parken/Check-in, Telefonnummer)
   ============================================================= */
const SLUG = "oetztal";

function applyHaus(lang){
  const haus = (typeof HAEUSER !== "undefined" && HAEUSER[SLUG]) ? HAEUSER[SLUG] : {};

  const setRow = (id, val) => {
    const el = document.getElementById(id);
    if(!el) return;
    const li = el.closest("li");
    if(val && String(val).trim()){
      el.textContent = val;
      if(li) li.style.display = "";
    } else if(li){
      li.style.display = "none";
    }
  };

  setRow("hausAdresse", haus.adresse);
  setRow("hausWlan",    haus.wlan);
  setRow("hausWlanPw",  haus.wlanpasswort);
  setRow("hausHinweis", haus.hinweis && haus.hinweis[lang]);

  if(haus.parken && haus.parken[lang]){
    const el = document.querySelector('[data-i18n="valParking"]');
    if(el) el.textContent = haus.parken[lang];
  }
  if(haus.checkin && haus.checkin[lang]){
    const el = document.querySelector('[data-i18n="valCheckin"]');
    if(el) el.textContent = haus.checkin[lang];
  }

  const cl = document.getElementById("callLink");
  if(cl && typeof MYALPS_TEL !== "undefined" && MYALPS_TEL){
    cl.setAttribute("href", "tel:" + MYALPS_TEL);
  }
}

const _setLangBasis = setLang;
setLang = function(lang){ _setLangBasis(lang); applyHaus(lang); };
applyHaus(document.documentElement.lang || "de");
</script>
</body>
</html>
