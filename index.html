<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Check-in · MYALPS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Hanken+Grotesk:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{--spruce:#123a31;--snow:#f6f4ed;--amber:#e6a13c;--muted:#c3d1cb;
    --display:"Bricolage Grotesque",sans-serif;--body:"Hanken Grotesk",sans-serif;}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:var(--body);background:var(--spruce);color:#eef3f0;
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    text-align:center;padding:32px;-webkit-font-smoothing:antialiased;}
  .box{max-width:400px}
  .eyebrow{font-size:12px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;
    color:var(--amber);margin-bottom:20px}
  h1{font-family:var(--display);font-weight:600;font-size:30px;line-height:1.12;
    letter-spacing:-.01em;margin-bottom:16px}
  p{color:var(--muted);font-size:17px;line-height:1.55}
  .qr{width:52px;height:52px;margin:0 auto 26px;color:var(--amber)}
  .qr svg{width:100%;height:100%}
</style>
</head>
<body>
  <div class="box">
    <div class="qr" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/>
        <rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3M20 14v.01M14 20v.01M20 20v.01M17 20h.01M20 17h.01"/>
      </svg>
    </div>
    <div class="eyebrow">MYALPS</div>
    <h1>Willkommen</h1>
    <p>Bitte scannen Sie den QR-Code an Ihrem Haus, um zu Ihren Check-in-Informationen zu gelangen.</p>
  </div>
</body>
</html>
